name: Validate

# Checks the Community Applications feed: the profile is present, every plugin
# wrapper is complete and points at a live .plg whose pluginURL matches exactly, and
# every Docker template is complete and identical to the copy at its TemplateURL.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch an app repo changing underneath us
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Profile
        run: |
          xmllint --noout ca_profile.xml
          profile=$(xmllint --xpath 'normalize-space(/CommunityApplications/Profile)' ca_profile.xml)
          [[ -n "$profile" ]] || { echo "::error file=ca_profile.xml::<Profile> must not be empty"; exit 1; }

      - name: Plugin wrappers
        run: |
          status=0
          for f in plugins/*.xml; do
            xmllint --noout "$f" || { status=1; continue; }
            for tag in Name PluginURL Overview Support Project Category; do
              v=$(xmllint --xpath "normalize-space(/Plugin/$tag)" "$f")
              [[ -n "$v" ]] || { echo "::error file=$f::missing <$tag>"; status=1; }
            done
            url=$(xmllint --xpath 'normalize-space(/Plugin/PluginURL)' "$f")
            if ! curl -fsSL "$url" -o /tmp/plugin.plg; then
              echo "::error file=$f::PluginURL is not reachable: $url"; status=1; continue
            fi
            plg=$(xmllint --noent --xpath 'string(/PLUGIN/@pluginURL)' /tmp/plugin.plg)
            if [[ "$plg" != "$url" ]]; then
              echo "::error file=$f::PluginURL does not match the .plg's pluginURL ($plg)"; status=1
            fi
            for tag in Icon Screenshot; do
              for u in $(xmllint --xpath "/Plugin/$tag/text()" "$f" 2>/dev/null); do
                curl -fsSIL "$u" > /dev/null || { echo "::error file=$f::<$tag> not reachable: $u"; status=1; }
              done
            done
            echo "$f: ok"
          done
          exit $status

      - name: Docker templates
        run: |
          shopt -s nullglob
          status=0
          for f in templates/*.xml; do
            xmllint --noout "$f" || { status=1; continue; }
            for tag in Name Repository Overview Support Project Category Icon TemplateURL WebUI; do
              v=$(xmllint --xpath "normalize-space(/Container/$tag)" "$f")
              [[ -n "$v" ]] || { echo "::error file=$f::missing <$tag>"; status=1; }
            done
            dups=$(xmllint --xpath '/Container/Config/@Target' "$f" | tr ' ' '\n' | grep . | sort | uniq -d)
            [[ -z "$dups" ]] || { echo "::error file=$f::duplicate Config targets: $dups"; status=1; }
            url=$(xmllint --xpath 'normalize-space(/Container/TemplateURL)' "$f")
            if ! curl -fsSL "$url" -o /tmp/template.xml; then
              echo "::error file=$f::TemplateURL is not reachable: $url"; status=1; continue
            fi
            if ! diff -u /tmp/template.xml "$f"; then
              echo "::error file=$f::differs from the copy at its TemplateURL ($url). Copy it again from the app's repository."; status=1
            fi
            icon=$(xmllint --xpath 'normalize-space(/Container/Icon)' "$f")
            curl -fsSIL "$icon" > /dev/null || { echo "::error file=$f::<Icon> not reachable: $icon"; status=1; }
            echo "$f: ok"
          done
          exit $status
